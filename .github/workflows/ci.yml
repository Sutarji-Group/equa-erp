name: CI

# D-16: branch kerja diuji lewat PR (tidak dobel push + pull_request); main & development diuji saat menerima push.
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    # Suite Vitest ±1.400 uji (PGlite) butuh ±10–15 menit di runner; 20 menit terlalu mepet (run dibatalkan).
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DB_DRIVER: pglite
      # tsc atas seluruh proyek butuh ±2,4 GB heap; batas bawaan Node di runner ±2 GB → OOM (exit 134).
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Pasang dependensi
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        # vitest.config.ts memakai maxWorkers 50% (mesin dev dipakai bersama); runner CI khusus job ini → semua core.
        run: pnpm vitest run --maxWorkers=100%
