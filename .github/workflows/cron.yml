name: Cron tick

# Pemicu pekerjaan terjadwal tiap 5 menit (Vercel Cron Hobby hanya harian — lihat docs/DECISIONS.md D-01).
# Butuh secret repositori CRON_SECRET dan variabel/secret APP_URL. Dilewati bila kosong.
# Jadwal GitHub hanya berjalan dari branch bawaan repositori (main = produksi, D-16) dan hanya bila vars.CRON_ENABLED=true.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-tick
  cancel-in-progress: false

jobs:
  tick:
    # Jadwal hanya berjalan bila variabel repositori CRON_ENABLED=true (D-16): repo private membayar ≥ 1 menit per job,
    # jadwal 5 menit ≈ 8.640 menit/bulan per job. "Run workflow" manual selalu boleh.
    if: github.event_name == 'workflow_dispatch' || vars.CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
    steps:
      - name: Panggil /api/cron/tick
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "CRON_SECRET atau APP_URL belum diisi — dilewati."
            exit 0
          fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/tick"

  # Pemantau uptime EKSTERNAL (NFR-02, NFR-28): berjalan di luar Vercel sehingga peringatan tetap terkirim saat aplikasi
  # mati. Secret opsional: ALERT_WEBHOOK_URL, RESEND_API_KEY + ALERT_EMAIL_TO (+ variabel ALERT_EMAIL_FROM). Status
  # gangguan dipertahankan antar-jalankan lewat cache; saat pulih, gangguan + durasinya dicatat ke /api/monitor/outage.
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO || vars.ALERT_EMAIL_TO }}
      ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
      STATE_DIR: .uptime-state
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Pulihkan status gangguan sebelumnya
        uses: actions/cache/restore@v4
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-
      - name: Periksa web kantor & API sinkron
        run: bash scripts/uptime-monitor.sh
      - name: Simpan status gangguan
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}
